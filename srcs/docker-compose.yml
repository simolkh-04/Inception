services:
  mariadb:
    build:
      context: ./requirements/mariadb
    container_name: mariadb

    env_file:
      - .env

    secrets:
      - db_root_password
      - db_password

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
    container_name: wordpress

    env_file:
      - .env

    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

    volumes:
      - wordpress_data:/var/www/html

    depends_on:
      - mariadb

    healthcheck:
      test: ["CMD-SHELL", "pgrep -x php-fpm8.2 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks:
      - inception

  redis:
    build:
      context: ./requirements/bonus/redis
    container_name: redis

    networks:
      - inception
  
  ftp:
    build:
      context: ./requirements/bonus/ftp
    container_name: ftp
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    depends_on:
      - wordpress
    networks:
      - inception

  website:
    build:
      context: ./requirements/bonus/website
    container_name: website
    ports:
      - "8080:80"
    networks:
      - inception
  
  adminer:
    build:
      context: ./requirements/bonus/adminer
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - mariadb
    networks:
      - inception
  
  portainer:
    image: portainer:img
    build: ./requirements/bonus/portainer
    container_name: portainer
    restart: on-failure
    networks : 
      - inception
    ports:
    - "9443:9443"
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    build:
      context: ./requirements/nginx
    container_name: nginx

    ports:
      - "443:443"

    volumes:
      - wordpress_data:/var/www/html:ro

    depends_on:
      wordpress:
        condition: service_healthy

    networks:
      - inception

volumes:
  mariadb_data:
  wordpress_data:

networks:
  inception:
    driver: bridge

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt

  db_password:
    file: ../secrets/db_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt