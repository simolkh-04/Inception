services:
  # ================= MANDATORY =================
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:img
    container_name: mariadb
    restart: on-failure
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    expose:
      - "3306"

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:img
    container_name: wordpress
    restart: on-failure
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    expose:
      - "9000"

  nginx:
    build:
      context: ./requirements/nginx
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
    image: nginx:img
    container_name: nginx
    restart: on-failure
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception

  # ================= BONUS =================
  redis:
    build: ./requirements/bonus/redis
    image: redis:img
    container_name: redis
    restart: on-failure
    networks:
      - inception
    expose:
      - "6379"

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:img
    container_name: adminer
    restart: on-failure
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - inception

  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:img
    container_name: ftp
    restart: on-failure
    depends_on:
      - wordpress
    env_file:
      - .env
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  static_site:
    build: ./requirements/bonus/website
    image: static_site:img
    container_name: static_site
    restart: on-failure
    ports:
      - "8081:80"
    networks:
      - inception

  portainer:
    build: ./requirements/bonus/portainer
    image: portainer:img
    container_name: portainer
    restart: on-failure
    ports:
      - "9443:9443"
    networks:
      - inception
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt